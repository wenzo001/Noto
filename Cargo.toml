[workspace]
resolver = "2"
members = [
  "crates/notera-core",
  "crates/notera-richtext",
  "crates/notera-crypto",
  "crates/notera-store",
  "crates/notera-config",
  "crates/notera-net",
  "crates/notera-webdav",
  "crates/notera-sync",
  "crates/notera-importer",
  "crates/notera-host",
  "crates/notera-cli",
  "crates/notera-test-webdav",
  "crates/notera-shell",
  "apps/desktop/src-tauri",
  "apps/mobile/src-tauri",
]
exclude = ["tools/feasibility-probe"]

[workspace.package]
version = "0.0.152"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/notera/notera"

[workspace.dependencies]
notera-core = { path = "crates/notera-core" }
notera-richtext = { path = "crates/notera-richtext" }
notera-crypto = { path = "crates/notera-crypto" }
notera-store = { path = "crates/notera-store" }
notera-config = { path = "crates/notera-config" }
notera-net = { path = "crates/notera-net" }
notera-webdav = { path = "crates/notera-webdav" }
notera-sync = { path = "crates/notera-sync" }
notera-importer = { path = "crates/notera-importer" }
notera-host = { path = "crates/notera-host" }
notera-shell = { path = "crates/notera-shell" }
notera-test-webdav = { path = "crates/notera-test-webdav" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.11"
aes-gcm-siv = "0.12"
argon2 = "0.6"
rand = "0.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "socks", "system-proxy", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "net", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
dashmap = "6"
# 标签名的唯一相等关系要用它（ADR-0022 D3：NFKC + 全 Unicode 小写，全仓只有一处算 canonical）。
# **零新下载**：锁里早就有 2.3.0（经 `url → idna → idna_adapter`），这里只是把一条已存在的传递依赖
# 升成 `notera-core` 的直接依赖 ⇒ Cargo.lock 只多一条边，不多一个包。
# ⚠ `default-features = false` 是**必需的**，不是洁癖：默认特性多开 `utf8_iter`/`utf16_iter` 两个
# optional 依赖（`icu_normalizer` 的 `default = ["compiled_data","utf8_iter","utf16_iter"]`），
# 而 `idna_adapter` 锁进来的是 `default-features = false + compiled_data` 那一份。
# 照着开默认特性会让 `cargo build --offline` 当场要 `utf16_iter`（本机实测红过一次：
# "no matching package named `utf16_iter` found"）—— 也就是**为了一个归一化函数往产品里加两个包**。
# 只要 `compiled_data` 就够：`ComposingNormalizerBorrowed::new_nfkc()` + `.normalize(&str) -> Cow<str>`
# 都在这一档下就有（本机第二次踩在这里：类型名不是 `Normalizer`，那个名字在这个 crate 里根本不存在）。
# `icu_properties` 那一档**实测不需要**：只开 `compiled_data` 建得过、`canonical` 那 10 条测试全过，
# 所以按小的来（当初以为是它挡着 `Normalizer`，那个判断是错的，错在类型名）。
# 实测两条：`Cargo.lock` 只 +1 行（那条新边，不多一个包），`--offline` 建得过。
# 选它而不是 `unicode-normalization`：同一份数据表已经在编译产物里了，再引一套就是第二份真相 + 多一份体积
# （用户的抱怨一就是"包太大"，任何让包变长的"顺手"都要给理由）。
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
bytes = "1"
# 0.42：OSV/RustSec 对 0.37.5 报了两条可用性中断（RUSTSEC-2026-0194 重复属性名的二次方耗时、
# RUSTSEC-2026-0195 `NsReader` 的命名空间声明无界增长），修于 0.41.0。我们这处用法是读用户
# 丢进来的 .enex 与服务器返回的 PROPFIND —— 都是"别人给的字节"，所以这不是"顺手升依赖"。
# 选 0.42 而不是 0.41：tauri → plist 已经在用 0.42，合流之后锁里少一个版本。
# 换版本前先钉了三条行为锚（`notera-webdav/src/lease.rs::parse_pins` 前两条 +
# `notera-importer/src/enex.rs::entity_references_are_decoded_in_both_parse_passes`），
# 它们在 0.37.5 上全绿；升级之后必须仍然全绿，否则就是解析语义漂了，不是"编译过了就算对"。
# 实测真的漂了：0.42 起解析器**不再顺手反转义文本**，`&amp;` / `&#65;` 单独成
# `Event::GeneralRef`。只接 `Event::Text` 的后果不是报错，是**静默少字符**——
# 导入的正文变成"粗  斜  尖"，租约路径变成 `/x/locks/ab.json`（别人的租约就此看不见）。
# 三个消费点各自补了引用这一格，并各留了一条能红的锚（变异编号见 CHANGELOG 0.0.32）。
# 另有三条新锚（lease 的第三条、enex 的裸 &、注入器的原文读值）钉的是**这次顺手改掉的
# 两个旧行为**：0.37 上它们是红的 —— 旧代码遇到解不开的引用会把整条租约丢掉、
# 把整个文本节点变成空串，两处都是"看不见的丢失"。
quick-xml = "0.42"
# 测试基建专用（只进 notera-test-webdav，全仓都是 dev-dependency，进不了发布包）：
# TLS 源站 —— §28 最后一格「真 TLS 握手失败」需要一台真能出示证书的源站，
# 以前所有测试都是 Strict 档打在明文 loopback 上，四档策略里没有一档被真握手验过。
rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
# 产品侧（缺口 G35 的修法）：`CaBundle` 要在**我们这一层**把"系统根 ∪ 用户这份 PEM"合起来
# 再交给 rustls 校验 —— reqwest 0.13 的 `add_root_certificate` 会把整条校验推给平台校验器，
# 而 Windows 上它不肯用用户递进来的根验签（NTE_BAD_SIGNATURE），表现就是"填对 CA 也连不上自签端点"。
# 这个 crate 锁里本来就有（0.8.4，由 rustls-platform-verifier 带进来），这里只多一条直接依赖边，不动版本。
rustls-native-certs = "0.8"
percent-encoding = "2"
tempfile = "3"

# OS 凭据库只在一个地方碰 Win32（crates/notera-host/src/credential_store.rs）。
# 版本钉在依赖树里已有的那一份，免得同一个构建里出现两套 windows-sys。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
